plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agendavoz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.agendavoz.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // La app no usa librerías externas: solo Android. JUnit es solo para las pruebas del intérprete.
    testImplementation 'junit:junit:4.13.2'
}
