name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgendaVoz
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Revisar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Descargar el modelo de voz en español (Vosk, para «Honor»)
        run: |
          curl -L --fail --retry 3 -o /tmp/modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          rm -rf /tmp/modelo && mkdir -p /tmp/modelo && unzip -q /tmp/modelo.zip -d /tmp/modelo
          carpeta=$(find /tmp/modelo -mindepth 1 -maxdepth 1 -type d | head -1)
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-es
          mv "$carpeta" app/src/main/assets/model-es
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-es/uuid
          ls app/src/main/assets/model-es

      - name: Compilar la APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Subir la APK para descargarla
        uses: actions/upload-artifact@v4
        with:
          name: AgendaVoz-apk
          path: AgendaVoz/app/build/outputs/apk/debug/app-debug.apk
