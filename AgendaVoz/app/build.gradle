plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agendavoz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.agendavoz.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    // Firma fija: así cada APK nueva se instala ENCIMA de la anterior sin borrar tus datos.
    signingConfigs {
        fija {
            storeFile file('agendavoz-firma.jks')
            storeType 'pkcs12'
            storePassword 'agendavoz'
            keyAlias 'agendavoz'
            keyPassword 'agendavoz'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Vosk: reconocimiento de voz sin internet, para escuchar la palabra «Honor».
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'

    // JUnit es solo para las pruebas del intérprete.
    testImplementation 'junit:junit:4.13.2'
}
